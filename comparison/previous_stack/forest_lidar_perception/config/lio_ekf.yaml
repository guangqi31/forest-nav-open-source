# 现成robot_localization只融合LIO控制根的平面位姿，用自身运动模型输出高频状态。
# 不读取真值、不再次融合原始IMU（它已经被FAST-LIO融合）。
/**:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.4
    two_d_mode: true
    transform_time_offset: 0.05
    transform_timeout: 0.0
    predict_to_current_time: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    odom0: /lio/control_odometry
    odom0_config: [true, true, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 20
