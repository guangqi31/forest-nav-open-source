planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.0
      allow_unknown: false
      downsample_costmap: false
      cost_travel_multiplier: 4.0
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 0
        w_smooth: 0.0
        w_data: 0.0
        do_refinement: false
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: false
      resolution: 0.1
      update_frequency: 5.0
      publish_frequency: 5.0
      robot_radius: 0.45
      footprint_padding: 0.0
      track_unknown_space: true
      unknown_cost_value: 255
      lethal_cost_threshold: 100
      trinary_costmap: false
      always_send_full_costmap: true
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /traversability_map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        footprint_clearing_enabled: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.9
        cost_scaling_factor: 3.0
        inflate_around_unknown: true
        inflate_unknown: false
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    odom_topic: /odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    publish_zero_velocity: true
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.2
      stateful: true
    FollowPath:
      # 路径方向突变时先按碰撞检查后的航向旋转，随后仍由 DWB 跟踪。
      # 避免短前视栅格评分出现“停住与转向同分”而长期停滞。
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: dwb_core::DWBLocalPlanner
      angular_dist_threshold: 0.6
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 0.8
      simulate_ahead_time: 1.0
      debug_trajectory_details: false
      min_vel_x: 0.0
      max_vel_x: 0.7
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.7
      min_speed_theta: 0.0
      acc_lim_x: 0.8
      acc_lim_y: 0.0
      acc_lim_theta: 0.8
      decel_lim_x: -0.8
      decel_lim_y: 0.0
      decel_lim_theta: -0.8
      vx_samples: 15
      vy_samples: 1
      vtheta_samples: 21
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.05
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - BaseObstacle
      - ObstacleFootprint
      - PathAlign
      - GoalAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.02
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 16.0
      PathAlign.forward_point_distance: 0.15
      GoalAlign.scale: 8.0
      GoalAlign.forward_point_distance: 0.15
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.5
      rolling_window: true
      resolution: 0.1
      update_frequency: 10.0
      publish_frequency: 5.0
      robot_radius: 0.45
      footprint_padding: 0.0
      track_unknown_space: true
      unknown_cost_value: 255
      lethal_cost_threshold: 100
      trinary_costmap: false
      always_send_full_costmap: true
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /traversability_map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        footprint_clearing_enabled: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.9
        cost_scaling_factor: 3.0
        inflate_around_unknown: true
        inflate_unknown: false
      width: 6
      height: 6
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_rate_controller_bt_node
    - nav2_pipeline_sequence_bt_node
