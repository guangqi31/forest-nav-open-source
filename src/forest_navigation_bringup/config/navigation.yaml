# CMU四个节点参数按固定版本原生launch逐项原值展开；pathFolder由启动文件定位。
# FAR先加载原生default.yaml，再使用本文件覆盖以下接口/在线输入配置。
# is_static_env=false让FAR消费在线观测，不依赖预先加载的完整静态地图。
# 尺寸、速度及地形阈值当前保留上游基线，尚未声称完成G1标定。
# 没有新增限速、仲裁、任务否决或保护节点；上游本身的参数行为仍存在。
terrainAnalysis:
  ros__parameters:
    use_sim_time: true
    scanVoxelSize: 0.05
    decayTime: 2.0
    noDecayDis: 4.0
    clearingDis: 8.0
    useSorting: false
    quantileZ: 0.25
    considerDrop: true
    limitGroundLift: false
    maxGroundLift: 0.15
    clearDyObs: true
    minDyObsDis: 0.3
    minDyObsAngle: 0.0
    minDyObsRelZ: -0.5
    absDyObsRelZThre: 0.2
    minDyObsVFOV: -16.0
    maxDyObsVFOV: 16.0
    minDyObsPointNum: 1
    noDataObstacle: false
    noDataBlockSkipNum: 0
    minBlockPointNum: 10
    vehicleHeight: 1.5
    voxelPointUpdateThre: 100
    voxelTimeUpdateThre: 2.0
    minRelZ: -2.5
    maxRelZ: 1.0
    disRatioZ: 0.2
terrainAnalysisExt:
  ros__parameters:
    use_sim_time: true
    scanVoxelSize: 0.1
    decayTime: 10.0
    noDecayDis: 0.0
    clearingDis: 30.0
    useSorting: false
    quantileZ: 0.1
    vehicleHeight: 1.5
    voxelPointUpdateThre: 100
    voxelTimeUpdateThre: 2.0
    lowerBoundZ: -2.5
    upperBoundZ: 1.0
    disRatioZ: 0.1
    checkTerrainConn: false
    terrainConnThre: 0.5
    terrainUnderVehicle: -0.75
    ceilingFilteringThre: 2.0
    localTerrainMapRadius: 4.0
localPlanner:
  ros__parameters:
    use_sim_time: true
    vehicleLength: 0.6
    vehicleWidth: 0.6
    sensorOffsetX: 0.0
    sensorOffsetY: 0.0
    twoWayDrive: true
    laserVoxelSize: 0.05
    terrainVoxelSize: 0.2
    useTerrainAnalysis: true
    checkObstacle: true
    checkRotObstacle: false
    adjacentRange: 4.25
    obstacleHeightThre: 0.15
    groundHeightThre: 0.1
    costHeightThre: 0.1
    costScore: 0.02
    useCost: false
    pointPerPathThre: 2
    minRelZ: -0.5
    maxRelZ: 0.25
    maxSpeed: 2.0
    dirWeight: 0.02
    dirThre: 90.0
    dirToVehicle: false
    pathScale: 1.25
    minPathScale: 0.75
    pathScaleStep: 0.25
    pathScaleBySpeed: true
    minPathRange: 1.0
    pathRangeStep: 0.5
    pathRangeBySpeed: true
    pathCropByGoal: true
    autonomyMode: true
    autonomySpeed: 2.0
    joyToSpeedDelay: 2.0
    joyToCheckObstacleDelay: 5.0
    goalClearRange: 0.5
    goalX: 0.0
    goalY: 0.0
pathFollower:
  ros__parameters:
    use_sim_time: true
    sensorOffsetX: 0.0
    sensorOffsetY: 0.0
    pubSkipNum: 1
    twoWayDrive: true
    lookAheadDis: 0.5
    yawRateGain: 7.5
    stopYawRateGain: 7.5
    maxYawRate: 90.0
    maxSpeed: 2.0
    maxAccel: 2.5
    switchTimeThre: 1.0
    dirDiffThre: 0.1
    stopDisThre: 0.2
    slowDwnDisThre: 0.85
    useInclRateToSlow: false
    inclRateThre: 120.0
    slowRate1: 0.25
    slowRate2: 0.5
    slowTime1: 2.0
    slowTime2: 2.0
    useInclToStop: false
    inclThre: 45.0
    stopTime: 5.0
    noRotAtStop: false
    noRotAtGoal: true
    autonomyMode: true
    autonomySpeed: 2.0
    joyToSpeedDelay: 2.0
far_planner:
  ros__parameters:
    use_sim_time: true
    world_frame: map
    is_static_env: false
